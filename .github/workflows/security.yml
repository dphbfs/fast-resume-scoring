name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday: new advisories for unchanged code

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read # CodeQL reads the workflow run (needed on private repos)
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Build
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
