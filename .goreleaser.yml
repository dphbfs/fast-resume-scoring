version: 2

project_name: fast-resume-scoring

builds:
  - &cli
    id: score
    main: ./cmd/score
    binary: score
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - <<: *cli
    id: extract
    main: ./cmd/extract
    binary: extract
  - <<: *cli
    id: check
    main: ./cmd/check
    binary: check

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - .env.example

dockers_v2:
  - dockerfile: Dockerfile
    images:
      - ghcr.io/dphbfs/fast-resume-scoring
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - examples
    labels:
      org.opencontainers.image.title: fast-resume-scoring
      org.opencontainers.image.description: Score how well a resume fits a job with a typed classifier (Jev).
      org.opencontainers.image.source: https://github.com/dphbfs/fast-resume-scoring
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
    sbom: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  draft: true
