<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="t d">
<title id="t">Match Score vs the generative reference, held-out set</title>
<desc id="d">Scatter of 20 held-out resume-job pairs. Jev Match Score MAE 8.6 points against one Claude Opus 5 call per pair; an independent recruiter judge scores MAE 8.8 against the same reference.</desc>
<style>
  .bg { fill: #fcfcfb }
  .title { fill: #0b0b0b; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif }
  .sub, .tick, .axis-label, .legend, .note { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif }
  .tick { fill: #898781 }
  .grid { stroke: #e1e0d9; stroke-width: 1 }
  .base { stroke: #c3c2b7; stroke-width: 1 }
  .band { fill: #cde2fb; opacity: 0.45 }
  .diag { stroke: #898781; stroke-width: 1.5; stroke-dasharray: 4 4 }
  .jev { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2 }
  .judge { fill: none; stroke: #898781; stroke-width: 1.5 }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19 }
    .title { fill: #ffffff }
    .sub, .axis-label, .legend, .note { fill: #c3c2b7 }
    .grid { stroke: #2c2c2a }
    .base { stroke: #383835 }
    .band { fill: #184f95; opacity: 0.35 }
    .jev { fill: #3987e5; stroke: #1a1a19 }
  }
</style>
